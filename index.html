<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cifras — Grupo de Louvor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --bg-2:#F7F7F7;
    --ink:#141414;
    --ink-soft:#6E6E6E;
    --wine:#6B1F2A;
    --wine-dark:#4E1620;
    --line:#E6E6E6;
    --danger:#B3261E;
    --cifra-size:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:14px 20px;
    border-bottom:1px solid var(--line);
    background:#fff;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand img{height:40px;width:auto;display:block;}
  .brand-text{display:flex;flex-direction:column;}
  .brand h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:21px;
    margin:0;
    color:var(--ink);
    letter-spacing:-0.01em;
  }
  .brand-sub{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:1px;
  }
  .header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .admin-badge{
    font-size:11px;
    font-weight:600;
    color:var(--wine);
    border:1px solid var(--wine);
    border-radius:20px;
    padding:3px 10px;
  }

  .btn{
    border:none;
    border-radius:6px;
    padding:9px 16px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }
  .btn-wine{background:var(--wine);color:#fff;}
  .btn-wine:hover{background:var(--wine-dark);}
  .btn-outline{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .btn-outline:hover{border-color:var(--wine);color:var(--wine);}
  .btn-ghost{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:13px;font-family:inherit;}
  .btn-ghost:hover{color:var(--wine);}
  .btn-sm{padding:5px 10px;font-size:12px;}

  .layout{display:flex;align-items:flex-start;min-height:calc(100vh - 65px);}
  .sidebar{
    width:290px;
    flex-shrink:0;
    border-right:1px solid var(--line);
    padding:16px 18px;
    min-height:calc(100vh - 65px);
    transition:margin-left .15s ease;
  }
  .sidebar.collapsed{margin-left:-290px;}
  .main{flex:1;padding:20px 26px 60px;min-width:0;}
  .main.full{padding-left:20px;}

  .collapse-btn{
    position:sticky;
    top:14px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:6px;
    width:30px;
    height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:14px;
    color:var(--ink-soft);
    margin-bottom:10px;
    z-index:5;
  }
  .collapse-btn:hover{border-color:var(--wine);color:var(--wine);}

  .mobile-menu-btn{
    display:none;
    position:fixed;
    top:74px;
    left:14px;
    z-index:30;
    background:var(--wine);
    color:#fff;
    border:none;
    border-radius:6px;
    width:38px;
    height:38px;
    font-size:18px;
    cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.18);
  }
  .sidebar-backdrop{
    display:none;
    position:fixed;
    top:0;left:0;right:0;bottom:0;
    background:rgba(0,0,0,.35);
    z-index:19;
  }
  .sidebar-backdrop.show{display:block;}

  .search-box{
    display:flex;
    align-items:center;
    border:1px solid var(--line);
    border-radius:6px;
    background:#fff;
    padding:8px 12px;
    margin-bottom:14px;
  }
  .search-box input{
    border:none;outline:none;font-size:14px;width:100%;background:transparent;color:var(--ink);font-family:inherit;
  }
  .nav-btn{
    width:100%;
    text-align:left;
    padding:9px 10px;
    background:none;
    border:none;
    border-radius:6px;
    font-size:14px;
    cursor:pointer;
    color:var(--ink);
    font-family:inherit;
    margin-bottom:4px;
  }
  .nav-btn:hover{background:var(--bg-2);}
  .nav-btn.active{background:var(--bg-2);font-weight:600;}

  .add-btn{width:100%;margin:10px 0 16px;}

  .cat-label{
    font-size:11px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--ink-soft);
    font-weight:600;
    margin:18px 0 4px;
    padding:0 10px;
  }
  .cat-label:first-of-type{margin-top:8px;}

  .song-list{list-style:none;margin:0;padding:0;}
  .song-item{
    padding:9px 10px;
    border-radius:6px;
    cursor:pointer;
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .song-item:hover{background:var(--bg-2);}
  .song-item.active{background:var(--bg-2);}
  .song-item .num{font-family:'JetBrains Mono', monospace;font-size:11.5px;color:var(--ink-soft);flex-shrink:0;width:22px;}
  .song-item .ttl{font-size:14px;flex:1;}
  .song-item .key{font-size:11px;color:var(--ink-soft);font-family:'JetBrains Mono', monospace;}
  .empty-list{color:var(--ink-soft);font-size:14px;padding:10px;}

  .placeholder{color:var(--ink-soft);font-size:15px;padding-top:40px;text-align:center;}

  .cifra-toolbar{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:6px;
  }
  .program-nav-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    background:var(--bg-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 12px;
    margin-bottom:14px;
  }
  .program-nav-group{display:flex;align-items:center;gap:10px;}
  .program-nav-pos{font-size:12px;color:var(--ink-soft);font-family:'JetBrains Mono', monospace;}
  .btn[disabled]{opacity:.4;cursor:not-allowed;}
  .cifra-title-wrap{display:flex;align-items:baseline;gap:10px;}
  .cifra-num{font-family:'JetBrains Mono', monospace;color:var(--ink-soft);font-size:14px;}
  .cifra-title{font-family:'Fraunces', serif;font-weight:600;font-size:26px;margin:0;color:var(--ink);}
  .cifra-meta{font-size:13px;color:var(--ink-soft);margin:4px 0 0;font-family:'JetBrains Mono', monospace;}
  .cifra-actions{display:flex;gap:6px;flex-shrink:0;align-items:center;flex-wrap:wrap;}
  .zoom-group{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  .zoom-group button{border:none;background:#fff;padding:6px 10px;cursor:pointer;font-size:13px;color:var(--ink-soft);font-family:inherit;}
  .zoom-group button:hover{background:var(--bg-2);color:var(--wine);}
  .zoom-group span{padding:0 8px;font-size:12px;color:var(--ink-soft);border-left:1px solid var(--line);border-right:1px solid var(--line);}

  .cifra-body{
    white-space:pre-wrap;
    font-family:'JetBrains Mono', monospace;
    font-size:var(--cifra-size);
    line-height:1.85;
    background:var(--bg-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:20px 22px;
    margin-top:16px;
    overflow-x:auto;
  }

  .form-wrap{background:#fff;border:1px solid var(--line);border-radius:8px;padding:20px 22px;max-width:720px;}
  .form-wrap h2{font-family:'Fraunces', serif;font-weight:600;font-size:20px;margin:0 0 16px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .field > input, .field > textarea, .field > select{
    width:100%;border:1px solid var(--line);border-radius:6px;padding:9px 11px;font-size:14px;font-family:inherit;color:var(--ink);background:#fff;
  }
  .field textarea{font-family:'JetBrains Mono', monospace;font-size:13.5px;line-height:1.7;min-height:200px;resize:vertical;}
  .two-col{display:flex;gap:12px;}
  .two-col .field{flex:1;}
  .import-box{background:var(--bg-2);border:1px dashed var(--line);border-radius:8px;padding:14px 14px 4px;margin-bottom:14px;}
  .import-row{display:flex;gap:8px;}
  .import-row input{flex:1;}
  .import-status{font-size:12.5px;color:var(--ink-soft);margin-top:6px;min-height:16px;}
  .import-status.error{color:var(--danger);}
  .import-status.ok{color:var(--wine);}
  input[type="file"]{font-size:13px;color:var(--ink-soft);}
  .field-error{color:var(--danger);font-size:13px;margin-top:5px;}
  .form-actions{display:flex;gap:10px;margin-top:6px;}
  .status-msg{font-size:13px;color:var(--ink-soft);margin-top:10px;}
  .status-msg.error{color:var(--danger);}

  .summary-title, .prog-title{font-family:'Fraunces', serif;font-weight:600;font-size:23px;margin:0 0 4px;}
  .summary-sub{font-size:13px;color:var(--ink-soft);margin:0 0 20px;}
  .summary-cat{margin-bottom:22px;}
  .summary-cat h3{font-family:'Fraunces', serif;font-size:16px;font-weight:600;color:var(--wine);margin:0 0 8px;border-bottom:1px solid var(--line);padding-bottom:6px;}
  .summary-row{display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px;}
  .summary-row:hover{color:var(--wine);}
  .summary-row .n{font-family:'JetBrains Mono', monospace;color:var(--ink-soft);font-size:12px;width:24px;flex-shrink:0;}
  .summary-row span:last-child{color:var(--ink-soft);font-family:'JetBrains Mono', monospace;font-size:12px;}
  .summary-empty{font-size:14px;color:var(--ink-soft);}

  .prog-card{
    border:1px solid var(--line);
    border-radius:8px;
    padding:16px 18px;
    margin-bottom:14px;
    cursor:pointer;
    max-width:640px;
  }
  .prog-card:hover{border-color:var(--wine);}
  .prog-card h3{font-family:'Fraunces', serif;font-size:17px;margin:0 0 4px;}
  .prog-card p{margin:0;font-size:13px;color:var(--ink-soft);}
  .prog-card .prog-actions{margin-top:8px;display:flex;gap:8px;}

  .prog-detail{max-width:680px;}
  .prog-detail .field-label{font-size:12px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;margin:16px 0 4px;}
  .prog-detail .escala-box{white-space:pre-wrap;font-size:14px;background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;}
  .prog-song-row{
    display:flex;align-items:center;gap:10px;
    border-bottom:1px solid var(--line);
    padding:9px 2px;
    font-size:14px;
  }
  .prog-song-row .n{font-family:'JetBrains Mono', monospace;color:var(--ink-soft);width:20px;}
  .prog-song-row .ttl{flex:1;cursor:pointer;}
  .prog-song-row .ttl:hover{color:var(--wine);}
  .prog-song-row .order-btns{display:flex;gap:4px;}
  .prog-song-row .order-btns button{border:1px solid var(--line);background:#fff;border-radius:4px;width:24px;height:24px;cursor:pointer;font-size:12px;color:var(--ink-soft);}
  .prog-song-row .order-btns button:hover{border-color:var(--wine);color:var(--wine);}

  .picker-list{max-height:320px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:#fff;}
  .picker-cat-label{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin:14px 0 4px;}
  .picker-cat-label:first-child{margin-top:2px;}
  .picker-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 2px;font-size:13.5px;border-bottom:1px solid var(--line);}
  .picker-row:last-child{border-bottom:none;}
  .picker-row label{flex:1;cursor:pointer;min-width:0;}
  .picker-row input[type="checkbox"]{flex-shrink:0;width:16px;height:16px;margin:0;}

  .login-box{
    max-width:340px;
    border:1px solid var(--line);
    border-radius:8px;
    padding:20px;
  }
  .login-box h2{font-family:'Fraunces', serif;font-size:19px;margin:0 0 14px;}

  @media(max-width:800px){
    .collapse-btn{display:none;}
    .mobile-menu-btn{display:flex;align-items:center;justify-content:center;}
    .sidebar{position:fixed;top:65px;left:0;bottom:0;background:#fff;z-index:20;width:280px;box-shadow:2px 0 12px rgba(0,0,0,.08);}
    .sidebar.collapsed{margin-left:-280px;}
    .main{width:100%;}
  }

  #printArea{display:none;}
  @media print{
    header, .sidebar, .header-actions, .cifra-actions{display:none !important;}
    body, .layout, .main{background:#fff !important;padding:0;margin:0;max-width:none;}
    #printArea{display:block !important;}
    #mainArea{display:none !important;}
    .print-song{page-break-before:always;padding:24px;}
    .print-summary{padding:24px;}
    .print-title{font-family:'Fraunces', serif;font-size:22px;color:#000;margin:0 0 2px;}
    .print-meta{font-family:'JetBrains Mono', monospace;font-size:12px;color:#555;margin:0 0 14px;}
    .print-body{white-space:pre-wrap;font-family:'JetBrains Mono', monospace;font-size:13px;line-height:1.7;color:#000;}
    .print-summary h1{font-family:'Fraunces', serif;font-size:24px;margin:0 0 18px;color:#000;}
    .print-summary h2{font-family:'Fraunces', serif;font-size:15px;margin:18px 0 6px;color:#000;border-bottom:1px solid #ccc;padding-bottom:4px;}
    .print-summary-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:#000;}
  }
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

const API_URL = 'https://script.google.com/macros/s/AKfycbweiyOXAIJEcyOGtMfp1P2p6gJY_twOodMsA43jz6ycwkwTpnTyEIGbEdS4moqGWa5bbg/exec';
const ADMIN_PASSWORD = 'louvor2026'; // troque essa senha aqui no código quando quiser
const CATEGORIES = ['Gerais', 'Ceia', 'Irmãs', 'Jovens', 'Crianças'];

let songs = [];
let programs = [];
let songsLoaded = false;
let programsLoaded = false;
let isAdmin = false;
let sidebarCollapsed = false;
let currentView = { mode: 'placeholder' };
let cifraFontSize = 14;
let programEditorState = null; // { editingId, name, theme, escala, songIds: [] }
let activeProgramContext = null; // { programId, songIds: [] }

/* ---------- storage ---------- */

async function loadSongs() {
  try {
    const res = await fetch(API_URL + '?key=songs');
    const data = await res.json();
    songs = Array.isArray(data) ? data : [];
    songsLoaded = true;
  } catch (e) {
    songs = [];
    songsLoaded = false;
  }
  renderList();
}

async function saveSongs() {
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(songs)
    });
    const data = await res.json();
    return !!data.ok;
  } catch (e) {
    return false;
  }
}

async function loadPrograms() {
  try {
    const res = await fetch(API_URL + '?key=programs');
    const data = await res.json();
    programs = Array.isArray(data) ? data : [];
    programsLoaded = true;
  } catch (e) {
    programs = [];
    programsLoaded = false;
  }
}

async function savePrograms() {
  try {
    const res = await fetch(API_URL + '?key=programs', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(programs)
    });
    const data = await res.json();
    return !!data.ok;
  } catch (e) {
    return false;
  }
}

/* ---------- helpers ---------- */

function catLabel(cat) {
  return CATEGORIES.includes(cat) ? cat : 'Gerais';
}

function orderedSongs() {
  const out = [];
  CATEGORIES.forEach(cat => {
    songs.filter(s => catLabel(s.category) === cat)
      .sort((a, b) => a.title.localeCompare(b.title, 'pt-BR'))
      .forEach(s => out.push(s));
  });
  return out;
}

function songNumber(id) {
  const list = orderedSongs();
  const idx = list.findIndex(s => s.id === id);
  return idx === -1 ? '' : idx + 1;
}

/* ---------- admin ---------- */

function renderHeaderActions() {
  const el = document.getElementById('headerActions');
  el.innerHTML = '';
  if (isAdmin) {
    const badge = document.createElement('span');
    badge.className = 'admin-badge';
    badge.textContent = 'Modo admin';
    el.appendChild(badge);
    const exportBtn = document.createElement('button');
    exportBtn.className = 'btn btn-outline';
    exportBtn.textContent = 'Exportar tudo em PDF';
    exportBtn.addEventListener('click', exportAllPdf);
    el.appendChild(exportBtn);
    const logoutBtn = document.createElement('button');
    logoutBtn.className = 'btn-ghost';
    logoutBtn.textContent = 'Sair do modo admin';
    logoutBtn.addEventListener('click', () => {
      isAdmin = false;
      currentView = { mode: 'placeholder' };
      renderAll();
    });
    el.appendChild(logoutBtn);
  } else {
    const loginBtn = document.createElement('button');
    loginBtn.className = 'btn-ghost';
    loginBtn.textContent = 'Entrar como administrador';
    loginBtn.addEventListener('click', () => {
      const pw = window.prompt('Senha de administrador:');
      if (pw === null) return;
      if (pw === ADMIN_PASSWORD) {
        isAdmin = true;
        renderAll();
      } else {
        alert('Senha incorreta.');
      }
    });
    el.appendChild(loginBtn);
  }
}

function renderAll() {
  renderHeaderActions();
  renderList();
  renderMain();
}

/* ---------- sidebar / list ---------- */

document.getElementById('collapseBtn').addEventListener('click', () => {
  sidebarCollapsed = !sidebarCollapsed;
  applySidebarState();
});

document.getElementById('mobileMenuBtn').addEventListener('click', () => {
  sidebarCollapsed = false;
  applySidebarState();
});

document.getElementById('sidebarBackdrop').addEventListener('click', () => {
  sidebarCollapsed = true;
  applySidebarState();
});

function isMobile() {
  return window.innerWidth <= 800;
}

function applySidebarState() {
  document.getElementById('sidebar').classList.toggle('collapsed', sidebarCollapsed);
  document.getElementById('collapseBtn').textContent = sidebarCollapsed ? '▸' : '◂';
  document.getElementById('sidebarBackdrop').classList.toggle('show', isMobile() && !sidebarCollapsed);
}

if (isMobile()) {
  sidebarCollapsed = true;
  applySidebarState();
}

function renderList() {
  document.getElementById('newSongBtn').style.display = isAdmin ? 'block' : 'none';
  document.getElementById('summaryBtn').classList.toggle('active', currentView.mode === 'summary');
  document.getElementById('programBtn').classList.toggle('active', currentView.mode === 'programList' || currentView.mode === 'programDetail' || currentView.mode === 'programEdit');

  const container = document.getElementById('songList');
  const query = (document.getElementById('searchInput').value || '').toLowerCase();
  container.innerHTML = '';

  let any = false;
  CATEGORIES.forEach(cat => {
    const inCat = songs
      .filter(s => catLabel(s.category) === cat && s.title.toLowerCase().includes(query))
      .sort((a, b) => a.title.localeCompare(b.title, 'pt-BR'));
    if (inCat.length === 0) return;
    any = true;

    const label = document.createElement('div');
    label.className = 'cat-label';
    label.textContent = cat;
    container.appendChild(label);

    const ul = document.createElement('ul');
    ul.className = 'song-list';
    inCat.forEach(song => {
      const li = document.createElement('li');
      li.className = 'song-item' + (currentView.mode === 'view' && currentView.id === song.id ? ' active' : '');
      li.innerHTML = '<span class="num"></span><span class="ttl"></span><span class="key"></span>';
      li.querySelector('.num').textContent = String(songNumber(song.id)).padStart(2, '0');
      li.querySelector('.ttl').textContent = song.title;
      li.querySelector('.key').textContent = song.key || '';
      li.addEventListener('click', () => showSong(song.id));
      ul.appendChild(li);
    });
    container.appendChild(ul);
  });

  if (!any) {
    const div = document.createElement('div');
    div.className = 'empty-list';
    div.textContent = !songsLoaded ? 'Carregando...' : (songs.length === 0 ? 'Nenhuma cifra ainda.' : 'Nada encontrado.');
    container.appendChild(div);
  }
}

document.getElementById('searchInput').addEventListener('input', renderList);
document.getElementById('newSongBtn').addEventListener('click', () => { if (isAdmin) showNewForm(); });
document.getElementById('summaryBtn').addEventListener('click', showSummary);
document.getElementById('programBtn').addEventListener('click', showProgramList);

/* ---------- navigation ---------- */

function showSong(id, progContext) {
  const song = songs.find(s => s.id === id);
  if (!song) return;
  currentView = { mode: 'view', id: id };
  cifraFontSize = 14;
  activeProgramContext = progContext || null;
  if (isMobile()) { sidebarCollapsed = true; applySidebarState(); }
  renderList();
  renderMain();
}

function showNewForm() {
  if (!isAdmin) return;
  currentView = { mode: 'new' };
  renderList();
  renderMain();
}

function showEditForm(id) {
  if (!isAdmin) return;
  currentView = { mode: 'edit', id: id };
  renderList();
  renderMain();
}

function showSummary() {
  currentView = { mode: 'summary' };
  renderList();
  renderMain();
}

function showProgramList() {
  currentView = { mode: 'programList' };
  renderList();
  renderMain();
}

function showProgramDetail(id) {
  currentView = { mode: 'programDetail', id: id };
  renderList();
  renderMain();
}

function showProgramEditor(existingId) {
  if (!isAdmin) return;
  if (existingId) {
    const p = programs.find(x => x.id === existingId);
    programEditorState = {
      editingId: p.id,
      name: p.name,
      theme: p.theme || '',
      escala: p.escala || '',
      songIds: (p.songIds || []).slice()
    };
  } else {
    programEditorState = { editingId: null, name: '', theme: '', escala: '', songIds: [] };
  }
  currentView = { mode: 'programEdit' };
  renderList();
  renderMain();
}

/* ---------- main renderer ---------- */

function renderMain() {
  const main = document.getElementById('mainArea');

  if (currentView.mode === 'placeholder') {
    main.innerHTML = '<div class="placeholder">Selecione uma cifra na lista, veja o sumário ou a programação.</div>';
    return;
  }

  if (currentView.mode === 'summary') {
    renderSummaryView(main);
    return;
  }

  if (currentView.mode === 'view') {
    renderSongView(main);
    return;
  }

  if (currentView.mode === 'new' || currentView.mode === 'edit') {
    renderSongForm(main);
    return;
  }

  if (currentView.mode === 'programList') {
    renderProgramList(main);
    return;
  }

  if (currentView.mode === 'programDetail') {
    renderProgramDetail(main);
    return;
  }

  if (currentView.mode === 'programEdit') {
    renderProgramEditor(main);
    return;
  }
}

/* ---------- summary ---------- */

function renderSummaryView(main) {
  main.innerHTML = '';
  const title = document.createElement('h2');
  title.className = 'summary-title';
  title.textContent = 'Sumário';
  main.appendChild(title);
  const sub = document.createElement('p');
  sub.className = 'summary-sub';
  sub.textContent = songs.length + (songs.length === 1 ? ' cifra cadastrada' : ' cifras cadastradas');
  main.appendChild(sub);

  let hasAny = false;
  CATEGORIES.forEach(cat => {
    const inCat = songs.filter(s => catLabel(s.category) === cat).sort((a, b) => a.title.localeCompare(b.title, 'pt-BR'));
    if (inCat.length === 0) return;
    hasAny = true;
    const block = document.createElement('div');
    block.className = 'summary-cat';
    const h3 = document.createElement('h3');
    h3.textContent = cat;
    block.appendChild(h3);
    inCat.forEach(song => {
      const row = document.createElement('div');
      row.className = 'summary-row';
      row.innerHTML = '<span class="n"></span><span></span><span></span>';
      const spans = row.querySelectorAll('span');
      spans[0].textContent = String(songNumber(song.id)).padStart(2, '0');
      spans[1].textContent = song.title;
      spans[2].textContent = song.key || '';
      row.addEventListener('click', () => showSong(song.id));
      block.appendChild(row);
    });
    main.appendChild(block);
  });

  if (!hasAny) {
    const empty = document.createElement('p');
    empty.className = 'summary-empty';
    empty.textContent = songsLoaded ? 'Nenhuma cifra cadastrada ainda.' : 'Carregando...';
    main.appendChild(empty);
  }
}

/* ---------- song view ---------- */

function renderSongView(main) {
  const song = songs.find(s => s.id === currentView.id);
  if (!song) { currentView = { mode: 'placeholder' }; renderMain(); return; }
  main.innerHTML = '';

  if (activeProgramContext && activeProgramContext.songIds.includes(song.id)) {
    const bar = document.createElement('div');
    bar.className = 'program-nav-bar';
    const idx = activeProgramContext.songIds.indexOf(song.id);
    const prevId = idx > 0 ? activeProgramContext.songIds[idx - 1] : null;
    const nextId = idx < activeProgramContext.songIds.length - 1 ? activeProgramContext.songIds[idx + 1] : null;

    const backBtn = document.createElement('button');
    backBtn.className = 'btn-ghost';
    backBtn.textContent = '← Voltar para a programação';
    backBtn.addEventListener('click', () => showProgramDetail(activeProgramContext.programId));
    bar.appendChild(backBtn);

    const navGroup = document.createElement('div');
    navGroup.className = 'program-nav-group';

    const prevBtn = document.createElement('button');
    prevBtn.className = 'btn btn-outline btn-sm';
    prevBtn.textContent = '◂ Anterior';
    prevBtn.disabled = !prevId;
    prevBtn.addEventListener('click', () => { if (prevId) showSong(prevId, activeProgramContext); });
    navGroup.appendChild(prevBtn);

    const posLabel = document.createElement('span');
    posLabel.className = 'program-nav-pos';
    posLabel.textContent = (idx + 1) + ' de ' + activeProgramContext.songIds.length;
    navGroup.appendChild(posLabel);

    const nextBtn = document.createElement('button');
    nextBtn.className = 'btn btn-outline btn-sm';
    nextBtn.textContent = 'Próxima ▸';
    nextBtn.disabled = !nextId;
    nextBtn.addEventListener('click', () => { if (nextId) showSong(nextId, activeProgramContext); });
    navGroup.appendChild(nextBtn);

    bar.appendChild(navGroup);
    main.appendChild(bar);
  }

  const toolbar = document.createElement('div');
  toolbar.className = 'cifra-toolbar';

  const titleWrap = document.createElement('div');
  titleWrap.innerHTML =
    '<div class="cifra-title-wrap"><span class="cifra-num"></span><h2 class="cifra-title"></h2></div><p class="cifra-meta"></p>';
  titleWrap.querySelector('.cifra-num').textContent = String(songNumber(song.id)).padStart(2, '0');
  titleWrap.querySelector('.cifra-title').textContent = song.title;
  const metaParts = [catLabel(song.category)];
  if (song.key) metaParts.push('Tom: ' + song.key);
  titleWrap.querySelector('.cifra-meta').textContent = metaParts.join(' · ');
  toolbar.appendChild(titleWrap);

  const actions = document.createElement('div');
  actions.className = 'cifra-actions';

  const zoomGroup = document.createElement('div');
  zoomGroup.className = 'zoom-group';
  zoomGroup.innerHTML = '<button id="zoomOut">A−</button><span id="zoomLabel"></span><button id="zoomIn">A+</button>';
  actions.appendChild(zoomGroup);

  if (isAdmin) {
    const editBtn = document.createElement('button');
    editBtn.className = 'btn btn-outline btn-sm';
    editBtn.textContent = 'Editar';
    editBtn.addEventListener('click', () => showEditForm(song.id));
    actions.appendChild(editBtn);

    const delBtn = document.createElement('button');
    delBtn.className = 'btn btn-outline btn-sm';
    delBtn.textContent = 'Excluir';
    delBtn.addEventListener('click', async () => {
      if (confirm('Excluir "' + song.title + '"? Isso remove a cifra para todo o grupo.')) {
        songs = songs.filter(s => s.id !== song.id);
        const ok = await saveSongs();
        currentView = { mode: 'placeholder' };
        renderList();
        renderMain();
        if (!ok) alert('Não foi possível salvar a exclusão. Tente novamente.');
      }
    });
    actions.appendChild(delBtn);
  }

  toolbar.appendChild(actions);
  main.appendChild(toolbar);

  const body = document.createElement('div');
  body.className = 'cifra-body';
  body.id = 'cifraBodyEl';
  body.style.setProperty('--cifra-size', cifraFontSize + 'px');
  body.style.fontSize = cifraFontSize + 'px';
  body.textContent = song.body;
  main.appendChild(body);

  document.getElementById('zoomLabel').textContent = cifraFontSize + 'px';
  document.getElementById('zoomOut').addEventListener('click', () => {
    cifraFontSize = Math.max(10, cifraFontSize - 1);
    document.getElementById('cifraBodyEl').style.fontSize = cifraFontSize + 'px';
    document.getElementById('zoomLabel').textContent = cifraFontSize + 'px';
  });
  document.getElementById('zoomIn').addEventListener('click', () => {
    cifraFontSize = Math.min(28, cifraFontSize + 1);
    document.getElementById('cifraBodyEl').style.fontSize = cifraFontSize + 'px';
    document.getElementById('zoomLabel').textContent = cifraFontSize + 'px';
  });
}

/* ---------- song form ---------- */

function renderSongForm(main) {
  if (!isAdmin) {
    main.innerHTML = '<div class="placeholder">Acesso restrito ao administrador.</div>';
    return;
  }
  const editing = currentView.mode === 'edit';
  const song = editing ? songs.find(s => s.id === currentView.id) : null;
  const options = CATEGORIES.map(c => '<option value="' + c + '">' + c + '</option>').join('');

  main.innerHTML =
    '<div class="form-wrap">' +
    '<h2>' + (editing ? 'Editar cifra' : 'Nova cifra') + '</h2>' +
    '<div class="field"><label>Nome da música</label><input type="text" id="titleInput"></div>' +
    '<div class="two-col">' +
    '<div class="field"><label>Categoria</label><select id="catInput">' + options + '</select></div>' +
    '<div class="field"><label>Tom (opcional)</label><input type="text" id="keyInput" placeholder="Ex: G, D, C#m"></div>' +
    '</div>' +
    '<div class="import-box">' +
    '<div class="field"><label>Importar de um link do Cifra Club (opcional)</label>' +
    '<div class="import-row"><input type="text" id="ccUrlInput" placeholder="https://www.cifraclub.com.br/..."><button type="button" class="btn btn-outline btn-sm" id="ccFetchBtn">Buscar</button></div>' +
    '<div class="import-status" id="ccStatus"></div></div>' +
    '<div class="field"><label>Ou importar de um PDF (opcional)</label>' +
    '<input type="file" id="pdfInput" accept="application/pdf">' +
    '<div class="import-status" id="pdfStatus"></div></div>' +
    '</div>' +
    '<div class="field"><label>Cifra</label><textarea id="bodyInput" placeholder="Cole aqui a cifra, com os acordes acima da letra, ou use um dos importadores acima"></textarea><div class="field-error" id="formError"></div></div>' +
    '<div class="form-actions"><button class="btn btn-wine" id="saveBtn">Salvar</button><button class="btn btn-outline" id="cancelBtn">Cancelar</button></div>' +
    '<div class="status-msg" id="statusMsg"></div>' +
    '</div>';

  if (editing && song) {
    document.getElementById('titleInput').value = song.title;
    document.getElementById('catInput').value = catLabel(song.category);
    document.getElementById('keyInput').value = song.key || '';
    document.getElementById('bodyInput').value = song.body;
  } else {
    document.getElementById('catInput').value = 'Gerais';
  }

  document.getElementById('ccFetchBtn').addEventListener('click', async () => {
    const url = document.getElementById('ccUrlInput').value.trim();
    const statusEl = document.getElementById('ccStatus');
    if (!url) {
      statusEl.textContent = 'Cole o link do Cifra Club primeiro.';
      statusEl.className = 'import-status error';
      return;
    }
    statusEl.textContent = 'Buscando...';
    statusEl.className = 'import-status';
    try {
      const res = await fetch(API_URL + '?action=fetchCifra&url=' + encodeURIComponent(url));
      const data = await res.json();
      if (data.ok) {
        document.getElementById('bodyInput').value = data.body;
        if (data.title && !document.getElementById('titleInput').value.trim()) {
          document.getElementById('titleInput').value = data.title;
        }
        statusEl.textContent = 'Cifra importada. Revise o texto antes de salvar.';
        statusEl.className = 'import-status ok';
      } else {
        statusEl.textContent = data.error || 'Não foi possível importar essa página.';
        statusEl.className = 'import-status error';
      }
    } catch (e) {
      statusEl.textContent = 'Erro de conexão ao buscar o link.';
      statusEl.className = 'import-status error';
    }
  });

  document.getElementById('pdfInput').addEventListener('change', async (ev) => {
    const file = ev.target.files[0];
    const statusEl = document.getElementById('pdfStatus');
    if (!file) return;
    statusEl.textContent = 'Lendo PDF...';
    statusEl.className = 'import-status';
    try {
      const text = await extractPdfText(file);
      document.getElementById('bodyInput').value = text.trim();
      statusEl.textContent = 'Texto extraído. Revise o alinhamento antes de salvar.';
      statusEl.className = 'import-status ok';
    } catch (e) {
      statusEl.textContent = 'Não foi possível ler esse PDF.';
      statusEl.className = 'import-status error';
    }
  });

  document.getElementById('cancelBtn').addEventListener('click', () => {
    currentView = editing ? { mode: 'view', id: song.id } : { mode: 'placeholder' };
    renderList();
    renderMain();
  });

  document.getElementById('saveBtn').addEventListener('click', async () => {
    const title = document.getElementById('titleInput').value.trim();
    const category = document.getElementById('catInput').value;
    const key = document.getElementById('keyInput').value.trim();
    const body = document.getElementById('bodyInput').value;
    const errorEl = document.getElementById('formError');
    const statusEl = document.getElementById('statusMsg');

    if (!title) { errorEl.textContent = 'Digite o nome da música.'; return; }
    if (!body.trim()) { errorEl.textContent = 'Cole ou digite a cifra.'; return; }
    errorEl.textContent = '';

    if (editing) {
      song.title = title; song.category = category; song.key = key; song.body = body;
    } else {
      songs.push({ id: 's' + Date.now(), title: title, category: category, key: key, body: body });
    }

    statusEl.textContent = 'Salvando...';
    const ok = await saveSongs();
    if (ok) {
      const savedId = editing ? song.id : songs[songs.length - 1].id;
      currentView = { mode: 'view', id: savedId };
      renderList();
      renderMain();
    } else {
      statusEl.textContent = 'Não foi possível salvar. Verifique a conexão e tente novamente.';
      statusEl.classList.add('error');
    }
  });
}

/* ---------- programação: lista ---------- */

function renderProgramList(main) {
  main.innerHTML = '';
  const title = document.createElement('h2');
  title.className = 'prog-title';
  title.textContent = 'Programação';
  main.appendChild(title);

  if (isAdmin) {
    const newBtn = document.createElement('button');
    newBtn.className = 'btn btn-wine';
    newBtn.style.marginBottom = '18px';
    newBtn.textContent = '+ Nova programação';
    newBtn.addEventListener('click', () => showProgramEditor(null));
    main.appendChild(newBtn);
  }

  if (!programsLoaded) {
    const p = document.createElement('p');
    p.className = 'summary-empty';
    p.textContent = 'Carregando...';
    main.appendChild(p);
    return;
  }

  if (programs.length === 0) {
    const p = document.createElement('p');
    p.className = 'summary-empty';
    p.textContent = 'Nenhuma programação salva ainda.';
    main.appendChild(p);
    return;
  }

  programs.slice().reverse().forEach(prog => {
    const card = document.createElement('div');
    card.className = 'prog-card';
    card.innerHTML = '<h3></h3><p></p>';
    card.querySelector('h3').textContent = prog.name;
    card.querySelector('p').textContent = (prog.theme ? 'Tema: ' + prog.theme + ' · ' : '') + (prog.songIds || []).length + ' cifra(s)';
    card.addEventListener('click', () => showProgramDetail(prog.id));
    main.appendChild(card);
  });
}

/* ---------- programação: detalhe ---------- */

function renderProgramDetail(main) {
  const prog = programs.find(p => p.id === currentView.id);
  if (!prog) { currentView = { mode: 'programList' }; renderMain(); return; }
  main.innerHTML = '';

  const wrap = document.createElement('div');
  wrap.className = 'prog-detail';

  const backBtn = document.createElement('button');
  backBtn.className = 'btn-ghost';
  backBtn.style.marginBottom = '10px';
  backBtn.textContent = '← Voltar para Programação';
  backBtn.addEventListener('click', showProgramList);
  wrap.appendChild(backBtn);

  const h2 = document.createElement('h2');
  h2.className = 'prog-title';
  h2.textContent = prog.name;
  wrap.appendChild(h2);

  if (isAdmin) {
    const actionsRow = document.createElement('div');
    actionsRow.style.display = 'flex';
    actionsRow.style.gap = '8px';
    actionsRow.style.marginBottom = '14px';
    const editBtn = document.createElement('button');
    editBtn.className = 'btn btn-outline btn-sm';
    editBtn.textContent = 'Editar';
    editBtn.addEventListener('click', () => showProgramEditor(prog.id));
    actionsRow.appendChild(editBtn);
    const delBtn = document.createElement('button');
    delBtn.className = 'btn btn-outline btn-sm';
    delBtn.textContent = 'Excluir';
    delBtn.addEventListener('click', async () => {
      if (confirm('Excluir a programação "' + prog.name + '"?')) {
        programs = programs.filter(p => p.id !== prog.id);
        const ok = await savePrograms();
        showProgramList();
        if (!ok) alert('Não foi possível salvar a exclusão.');
      }
    });
    actionsRow.appendChild(delBtn);
    wrap.appendChild(actionsRow);
  }

  if (prog.theme) {
    const lbl = document.createElement('div');
    lbl.className = 'field-label';
    lbl.textContent = 'Tema do culto';
    wrap.appendChild(lbl);
    const val = document.createElement('p');
    val.textContent = prog.theme;
    wrap.appendChild(val);
  }

  if (prog.escala) {
    const lbl2 = document.createElement('div');
    lbl2.className = 'field-label';
    lbl2.textContent = 'Escala';
    wrap.appendChild(lbl2);
    const esc = document.createElement('div');
    esc.className = 'escala-box';
    esc.textContent = prog.escala;
    wrap.appendChild(esc);
  }

  const lbl3 = document.createElement('div');
  lbl3.className = 'field-label';
  lbl3.textContent = 'Ordem das cifras';
  wrap.appendChild(lbl3);

  (prog.songIds || []).forEach((sid, idx) => {
    const song = songs.find(s => s.id === sid);
    const row = document.createElement('div');
    row.className = 'prog-song-row';
    row.innerHTML = '<span class="n"></span><span class="ttl"></span>';
    row.querySelector('.n').textContent = String(idx + 1).padStart(2, '0');
    row.querySelector('.ttl').textContent = song ? song.title : '(cifra removida)';
    if (song) {
      row.querySelector('.ttl').addEventListener('click', () => showSong(song.id, { programId: prog.id, songIds: (prog.songIds || []).slice() }));
    }
    wrap.appendChild(row);
  });

  main.appendChild(wrap);
}

/* ---------- programação: editor ---------- */

function renderProgramEditor(main) {
  if (!isAdmin) {
    main.innerHTML = '<div class="placeholder">Acesso restrito ao administrador.</div>';
    return;
  }
  const st = programEditorState;
  main.innerHTML = '';

  const wrap = document.createElement('div');
  wrap.className = 'form-wrap';
  wrap.style.maxWidth = '680px';

  wrap.innerHTML =
    '<h2>' + (st.editingId ? 'Editar programação' : 'Nova programação') + '</h2>' +
    '<div class="field"><label>Nome do culto (ex: Culto de domingo - 07/09)</label><input type="text" id="progName"></div>' +
    '<div class="field"><label>Tema do culto (opcional)</label><input type="text" id="progTheme"></div>' +
    '<div class="field"><label>Escala (opcional)</label><textarea id="progEscala" placeholder="Ex: Vocal - Fulana / Violão - Sicrano / Bateria - ..." style="min-height:100px;font-family:inherit;"></textarea></div>' +
    '<div class="field"><label>Selecionar cifras</label><div class="picker-list" id="pickerList"></div></div>' +
    '<div class="field"><label>Ordem no culto</label><div id="orderList"></div></div>' +
    '<div class="form-actions"><button class="btn btn-wine" id="progSaveBtn">Salvar programação</button><button class="btn btn-outline" id="progCancelBtn">Cancelar</button></div>' +
    '<div class="status-msg" id="progStatusMsg"></div>';

  main.appendChild(wrap);

  document.getElementById('progName').value = st.name;
  document.getElementById('progTheme').value = st.theme;
  document.getElementById('progEscala').value = st.escala;

  renderPicker();
  renderOrderList();

  document.getElementById('progCancelBtn').addEventListener('click', () => {
    programEditorState = null;
    showProgramList();
  });

  document.getElementById('progSaveBtn').addEventListener('click', async () => {
    const name = document.getElementById('progName').value.trim();
    const statusEl = document.getElementById('progStatusMsg');
    if (!name) { statusEl.textContent = 'Dê um nome para essa programação.'; statusEl.className = 'status-msg error'; return; }
    if (st.songIds.length === 0) { statusEl.textContent = 'Selecione ao menos uma cifra.'; statusEl.className = 'status-msg error'; return; }

    st.name = name;
    st.theme = document.getElementById('progTheme').value.trim();
    st.escala = document.getElementById('progEscala').value.trim();

    if (st.editingId) {
      const existing = programs.find(p => p.id === st.editingId);
      existing.name = st.name; existing.theme = st.theme; existing.escala = st.escala; existing.songIds = st.songIds.slice();
    } else {
      programs.push({ id: 'p' + Date.now(), name: st.name, theme: st.theme, escala: st.escala, songIds: st.songIds.slice() });
    }

    statusEl.textContent = 'Salvando...';
    statusEl.className = 'status-msg';
    const ok = await savePrograms();
    if (ok) {
      const savedId = st.editingId || programs[programs.length - 1].id;
      programEditorState = null;
      showProgramDetail(savedId);
    } else {
      statusEl.textContent = 'Não foi possível salvar. Tente novamente.';
      statusEl.className = 'status-msg error';
    }
  });
}

function renderPicker() {
  const el = document.getElementById('pickerList');
  el.innerHTML = '';
  const list = orderedSongs();
  if (list.length === 0) {
    el.innerHTML = '<div class="empty-list">Nenhuma cifra cadastrada ainda.</div>';
    return;
  }
  CATEGORIES.forEach(cat => {
    const inCat = list.filter(s => catLabel(s.category) === cat);
    if (inCat.length === 0) return;

    const label = document.createElement('div');
    label.className = 'picker-cat-label';
    label.textContent = cat;
    el.appendChild(label);

    inCat.forEach(song => {
      const row = document.createElement('div');
      row.className = 'picker-row';
      const checked = programEditorState.songIds.includes(song.id);
      row.innerHTML = '<label></label><input type="checkbox" ' + (checked ? 'checked' : '') + '>';
      row.querySelector('label').textContent = song.title;
      row.querySelector('input').addEventListener('change', (ev) => {
        if (ev.target.checked) {
          if (!programEditorState.songIds.includes(song.id)) programEditorState.songIds.push(song.id);
        } else {
          programEditorState.songIds = programEditorState.songIds.filter(id => id !== song.id);
        }
        renderOrderList();
      });
      el.appendChild(row);
    });
  });
}

function renderOrderList() {
  const el = document.getElementById('orderList');
  el.innerHTML = '';
  if (programEditorState.songIds.length === 0) {
    el.innerHTML = '<div class="empty-list">Marque as cifras acima para montar a ordem.</div>';
    return;
  }
  programEditorState.songIds.forEach((sid, idx) => {
    const song = songs.find(s => s.id === sid);
    const row = document.createElement('div');
    row.className = 'prog-song-row';
    row.innerHTML = '<span class="n"></span><span class="ttl"></span><div class="order-btns"><button data-dir="up">▲</button><button data-dir="down">▼</button></div>';
    row.querySelector('.n').textContent = String(idx + 1).padStart(2, '0');
    row.querySelector('.ttl').textContent = song ? song.title : '(cifra removida)';
    row.querySelectorAll('.order-btns button').forEach(btn => {
      btn.addEventListener('click', () => {
        const dir = btn.getAttribute('data-dir');
        const arr = programEditorState.songIds;
        if (dir === 'up' && idx > 0) {
          [arr[idx - 1], arr[idx]] = [arr[idx], arr[idx - 1]];
        } else if (dir === 'down' && idx < arr.length - 1) {
          [arr[idx + 1], arr[idx]] = [arr[idx], arr[idx + 1]];
        }
        renderOrderList();
      });
    });
    el.appendChild(row);
  });
}

/* ---------- PDF extraction ---------- */

async function extractPdfText(file) {
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  let fullText = '';
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const lines = [];
    content.items.forEach(item => {
      const y = Math.round(item.transform[5]);
      let line = lines.find(l => Math.abs(l.y - y) <= 2);
      if (!line) { line = { y: y, items: [] }; lines.push(line); }
      line.items.push(item);
    });
    lines.sort((a, b) => b.y - a.y);
    lines.forEach(line => {
      line.items.sort((a, b) => a.transform[4] - b.transform[4]);
      const cw = (line.items[0] && line.items[0].height) ? line.items[0].height * 0.58 : 5.2;
      let lineStr = '';
      let cursor = 0;
      line.items.forEach(item => {
        const targetCol = Math.max(cursor, Math.round(item.transform[4] / cw));
        while (cursor < targetCol) { lineStr += ' '; cursor++; }
        lineStr += item.str;
        cursor += item.str.length;
      });
      fullText += lineStr + '\n';
    });
    fullText += '\n';
  }
  return fullText;
}

/* ---------- PDF export (all songs) ---------- */

function buildPrintArea() {
  const printArea = document.getElementById('printArea');
  printArea.innerHTML = '';
  const summaryDiv = document.createElement('div');
  summaryDiv.className = 'print-summary';
  const h1 = document.createElement('h1');
  h1.textContent = 'Cifras — Grupo de Louvor';
  summaryDiv.appendChild(h1);

  const ordered = orderedSongs();
  CATEGORIES.forEach(cat => {
    const inCat = ordered.filter(s => catLabel(s.category) === cat);
    if (inCat.length === 0) return;
    const h2 = document.createElement('h2');
    h2.textContent = cat;
    summaryDiv.appendChild(h2);
    inCat.forEach(song => {
      const row = document.createElement('div');
      row.className = 'print-summary-row';
      row.innerHTML = '<span></span><span></span>';
      row.querySelector('span:first-child').textContent = String(songNumber(song.id)).padStart(2, '0') + ' · ' + song.title;
      row.querySelector('span:last-child').textContent = song.key || '';
      summaryDiv.appendChild(row);
    });
  });
  printArea.appendChild(summaryDiv);

  ordered.forEach(song => {
    const sec = document.createElement('div');
    sec.className = 'print-song';
    const t = document.createElement('p');
    t.className = 'print-title';
    t.textContent = String(songNumber(song.id)).padStart(2, '0') + ' · ' + song.title;
    sec.appendChild(t);
    const metaParts = [catLabel(song.category)];
    if (song.key) metaParts.push('Tom: ' + song.key);
    const m = document.createElement('p');
    m.className = 'print-meta';
    m.textContent = metaParts.join(' · ');
    sec.appendChild(m);
    const b = document.createElement('div');
    b.className = 'print-body';
    b.textContent = song.body;
    sec.appendChild(b);
    printArea.appendChild(sec);
  });
}

function exportAllPdf() {
  if (songs.length === 0) { alert('Ainda não há cifras cadastradas.'); return; }
  buildPrintArea();
  window.print();
}
